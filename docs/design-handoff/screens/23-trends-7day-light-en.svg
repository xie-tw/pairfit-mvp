<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#FAFAF9"/>
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" fill-opacity="0.85" stroke="#E7E5E4"/>
  <text x="195" y="36" font-size="16" fill="#1C1917" text-anchor="middle" font-weight="600">Trends</text>

  <text x="24" y="100" font-size="24" fill="#1C1917" font-weight="700">Trends</text>
  <text x="24" y="124" font-size="14" fill="#57534E">Charts and streaks.</text>

  <!-- Weight chart card -->
  <g transform="translate(24, 156)">
    <rect width="342" height="220" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="20" y="28" font-size="14" fill="#1C1917" font-weight="600">Weight</text>
    <text x="20" y="46" font-size="11" fill="#57534E">kg · last 7 days</text>

    <!-- Window toggle -->
    <g transform="translate(220, 16)">
      <rect width="106" height="24" rx="6" fill="#F5F5F4"/>
      <rect x="2" y="2" width="34" height="20" rx="4" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="19" y="16" font-size="11" fill="#1C1917" text-anchor="middle" font-weight="600">7D</text>
      <text x="53" y="16" font-size="11" fill="#57534E" text-anchor="middle">30D</text>
      <text x="87" y="16" font-size="11" fill="#57534E" text-anchor="middle">90D</text>
    </g>

    <!-- Line chart -->
    <polyline points="20,180 70,170 120,160 170,150 220,140 270,130 320,128" stroke="#FF6B6B" stroke-width="2.5" fill="none"/>
    <circle cx="20" cy="180" r="4" fill="#FF6B6B"/>
    <circle cx="70" cy="170" r="4" fill="#FF6B6B"/>
    <circle cx="120" cy="160" r="4" fill="#FF6B6B"/>
    <circle cx="170" cy="150" r="4" fill="#FF6B6B"/>
    <circle cx="220" cy="140" r="4" fill="#FF6B6B"/>
    <circle cx="270" cy="130" r="4" fill="#FF6B6B"/>
    <circle cx="320" cy="128" r="4" fill="#FF6B6B"/>
    <!-- X-axis labels -->
    <text x="20" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">M</text>
    <text x="70" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">T</text>
    <text x="120" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">W</text>
    <text x="170" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">T</text>
    <text x="220" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">F</text>
    <text x="270" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">S</text>
    <text x="320" y="200" font-size="10" fill="#A8A29E" text-anchor="middle">S</text>
  </g>

  <!-- Stat tiles -->
  <g transform="translate(24, 396)">
    <rect width="167" height="80" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <circle cx="32" cy="32" r="16" fill="#FFE4E6"/>
    <text x="32" y="38" font-size="18" text-anchor="middle">🔥</text>
    <text x="58" y="28" font-size="11" fill="#57534E" font-weight="600">BEST STREAK</text>
    <text x="58" y="52" font-size="20" fill="#1C1917" font-weight="700">12 days</text>
  </g>
  <g transform="translate(199, 396)">
    <rect width="167" height="80" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <circle cx="32" cy="32" r="16" fill="#DBEAFE"/>
    <text x="32" y="38" font-size="18" text-anchor="middle">📊</text>
    <text x="58" y="28" font-size="11" fill="#57534E" font-weight="600">AVG. WEEK</text>
    <text x="58" y="52" font-size="20" fill="#1C1917" font-weight="700">1.8k kcal</text>
  </g>

  <!-- Calories bar chart -->
  <g transform="translate(24, 496)">
    <rect width="342" height="180" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="20" y="28" font-size="14" fill="#1C1917" font-weight="600">Calories</text>
    <text x="20" y="46" font-size="11" fill="#57534E">kcal · last 7 days</text>
    <!-- Bars -->
    <rect x="30" y="100" width="32" height="50" rx="4" fill="#FECDD3"/>
    <rect x="80" y="80" width="32" height="70" rx="4" fill="#FECDD3"/>
    <rect x="130" y="110" width="32" height="40" rx="4" fill="#FECDD3"/>
    <rect x="180" y="60" width="32" height="90" rx="4" fill="#FF6B6B"/>
    <rect x="230" y="70" width="32" height="80" rx="4" fill="#FECDD3"/>
    <rect x="280" y="50" width="32" height="100" rx="4" fill="#FECDD3"/>
    <rect x="180" y="60" width="32" height="90" rx="4" fill="#FF6B6B" opacity="0.5"/>
  </g>
</svg>