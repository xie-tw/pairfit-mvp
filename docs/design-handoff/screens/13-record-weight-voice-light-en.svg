<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#FAFAF9"/>
  <!-- TopBar with back -->
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" fill-opacity="0.85" stroke="#E7E5E4"/>
  <text x="24" y="36" font-size="20" fill="#1C1917">←</text>
  <text x="195" y="36" font-size="16" fill="#1C1917" text-anchor="middle" font-weight="600">Weight</text>

  <text x="24" y="100" font-size="20" fill="#1C1917" font-weight="700">Log today's reading</text>
  <text x="24" y="124" font-size="13" fill="#57534E">Voice works best — speak naturally.</text>

  <!-- Big input -->
  <g transform="translate(24, 152)">
    <rect width="342" height="180" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="20" y="28" font-size="13" fill="#57534E">TODAY'S READING</text>
    <text x="171" y="100" font-size="56" fill="#1C1917" text-anchor="middle" font-weight="700">65.5<tspan font-size="20" fill="#57534E"> kg</tspan></text>
    <!-- Unit toggle -->
    <g transform="translate(80, 124)">
      <rect width="182" height="32" rx="8" fill="#F5F5F4"/>
      <rect x="4" y="4" width="86" height="24" rx="6" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="47" y="20" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">kg</text>
      <text x="135" y="20" font-size="13" fill="#57534E" text-anchor="middle">lb</text>
    </g>
  </g>

  <!-- Voice button big with pulse rings -->
  <g transform="translate(195, 432)">
    <circle cx="0" cy="0" r="80" fill="#FFE4E6" opacity="0.6"/>
    <circle cx="0" cy="0" r="60" fill="#FFE4E6"/>
    <circle cx="0" cy="0" r="48" fill="#FF6B6B"/>
    <text x="0" y="8" font-size="28" text-anchor="middle" fill="#FFFFFF">🎤</text>
  </g>
  <text x="195" y="540" font-size="14" fill="#1C1917" text-anchor="middle" font-weight="500">Hold to talk · I'm listening</text>
  <text x="195" y="560" font-size="12" fill="#57534E" text-anchor="middle">"Today 65.5 kg"</text>

  <!-- Mini history -->
  <text x="24" y="600" font-size="11" fill="#57534E" font-weight="600">LAST 7 DAYS</text>
  <g transform="translate(24, 614)">
    <rect width="342" height="60" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <polyline points="20,40 60,42 100,38 140,40 180,30 220,32 260,28 300,30" stroke="#FF6B6B" stroke-width="2" fill="none"/>
    <circle cx="20" cy="40" r="3" fill="#FF6B6B"/>
    <circle cx="60" cy="42" r="3" fill="#FF6B6B"/>
    <circle cx="100" cy="38" r="3" fill="#FF6B6B"/>
    <circle cx="140" cy="40" r="3" fill="#FF6B6B"/>
    <circle cx="180" cy="30" r="3" fill="#FF6B6B"/>
    <circle cx="220" cy="32" r="3" fill="#FF6B6B"/>
    <circle cx="260" cy="28" r="3" fill="#FF6B6B"/>
    <circle cx="300" cy="30" r="3" fill="#FF6B6B"/>
  </g>

  <g transform="translate(24, 700)">
    <rect width="342" height="48" rx="8" fill="#FF6B6B"/>
    <text x="171" y="30" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Save 65.5 kg</text>
  </g>
</svg>