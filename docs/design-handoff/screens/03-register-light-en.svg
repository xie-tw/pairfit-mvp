<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <!-- PairFit · Register · Light · English -->
  <rect width="390" height="844" fill="#FAFAF9"/>

  <!-- Brand mark -->
  <g transform="translate(167, 80)">
    <rect width="56" height="56" rx="16" fill="url(#brandGrad)"/>
    <text x="28" y="36" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">PF</text>
    <defs>
      <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FF6B6B"/>
        <stop offset="100%" stop-color="#14B8A6"/>
      </linearGradient>
    </defs>
  </g>

  <!-- Title -->
  <text x="195" y="172" font-size="24" fill="#1C1917" text-anchor="middle" font-weight="700">Create your account</text>
  <text x="195" y="198" font-size="14" fill="#57534E" text-anchor="middle">Three steps and you're set.</text>

  <!-- Card -->
  <g transform="translate(24, 230)">
    <rect width="342" height="320" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>

    <!-- Nickname field -->
    <text x="0" y="20" font-size="14" fill="#1C1917" font-weight="500">Nickname <tspan fill="#FF6B6B">*</tspan></text>
    <rect x="0" y="28" width="342" height="40" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
    <circle cx="20" cy="48" r="8" fill="#F5F5F4"/>
    <text x="44" y="52" font-size="14" fill="#A8A29E">What should we call you?</text>

    <!-- Email field -->
    <text x="0" y="92" font-size="14" fill="#1C1917" font-weight="500">Email <tspan fill="#FF6B6B">*</tspan></text>
    <rect x="0" y="100" width="342" height="40" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
    <circle cx="20" cy="120" r="8" fill="#F5F5F4"/>
    <text x="44" y="124" font-size="14" fill="#A8A29E">you@example.com</text>

    <!-- Password field -->
    <text x="0" y="164" font-size="14" fill="#1C1917" font-weight="500">Password <tspan fill="#FF6B6B">*</tspan></text>
    <rect x="0" y="172" width="342" height="40" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
    <circle cx="20" cy="192" r="8" fill="#F5F5F4"/>
    <text x="44" y="196" font-size="14" fill="#A8A29E">8+ characters</text>
    <text x="0" y="232" font-size="12" fill="#A8A29E">At least 8 characters, with a letter and a digit.</text>

    <!-- Confirm field -->
    <text x="0" y="260" font-size="14" fill="#1C1917" font-weight="500">Confirm password <tspan fill="#FF6B6B">*</tspan></text>
    <rect x="0" y="268" width="342" height="40" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
  </g>

  <!-- Avatar picker -->
  <text x="24" y="588" font-size="14" fill="#1C1917" font-weight="500">Pick an avatar (optional)</text>
  <g transform="translate(24, 600)">
    <circle cx="14" cy="14" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="14" y="20" font-size="14" text-anchor="middle" fill="#1C1917" font-weight="600">M</text>
    <circle cx="64" cy="14" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="64" y="20" font-size="20" text-anchor="middle">🦊</text>
    <circle cx="114" cy="14" r="20" fill="#FFE4E6" stroke="#FF6B6B" stroke-width="2"/>
    <text x="114" y="22" font-size="20" text-anchor="middle">🐶</text>
    <circle cx="164" cy="14" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="164" y="20" font-size="20" text-anchor="middle">🐱</text>
    <circle cx="214" cy="14" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="214" y="20" font-size="20" text-anchor="middle">🐼</text>
    <circle cx="264" cy="14" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="264" y="20" font-size="20" text-anchor="middle">🦁</text>
    <circle cx="314" cy="14" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="314" y="20" font-size="20" text-anchor="middle">🐸</text>
  </g>

  <!-- CTA -->
  <g transform="translate(24, 670)">
    <rect width="342" height="48" rx="8" fill="#FF6B6B"/>
    <text x="171" y="30" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Create account</text>
  </g>

  <!-- Footer -->
  <text x="195" y="752" font-size="14" fill="#57534E" text-anchor="middle">Already have an account? <tspan fill="#E11D48" font-weight="500">Sign in</tspan></text>

  <text x="195" y="824" font-size="10" fill="#A8A29E" text-anchor="middle">03-register-light-en</text>
</svg>