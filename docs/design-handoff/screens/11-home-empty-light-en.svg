<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#FAFAF9"/>
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" fill-opacity="0.85" stroke="#E7E5E4"/>
  <rect x="16" y="16" width="24" height="24" rx="8" fill="url(#bg11)"/>
  <text x="28" y="33" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">PF</text>
  <text x="48" y="26" font-size="14" fill="#1C1917" font-weight="600">PairFit</text>
  <text x="48" y="40" font-size="10" fill="#A8A29E">Move together · 一起动</text>
  <defs><linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient></defs>

  <text x="24" y="100" font-size="24" fill="#1C1917" font-weight="700">Hi, partner</text>
  <text x="24" y="124" font-size="14" fill="#57534E">Today's plan for both of you.</text>

  <!-- Empty progress cards -->
  <g transform="translate(24, 152)">
    <rect width="167" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-dasharray="4,4"/>
    <text x="14" y="22" font-size="11" fill="#57534E" font-weight="600">YOUR PROGRESS</text>
    <text x="14" y="52" font-size="20" fill="#A8A29E" font-weight="700">—</text>
    <rect x="14" y="64" width="139" height="6" rx="3" fill="#F5F5F4"/>
    <text x="14" y="88" font-size="11" fill="#A8A29E">Set a goal to start tracking</text>
  </g>
  <g transform="translate(199, 152)">
    <rect width="167" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-dasharray="4,4"/>
    <text x="14" y="22" font-size="11" fill="#57534E" font-weight="600">PARTNER'S</text>
    <text x="14" y="52" font-size="20" fill="#A8A29E" font-weight="700">—</text>
    <rect x="14" y="64" width="139" height="6" rx="3" fill="#F5F5F4"/>
    <text x="14" y="88" font-size="11" fill="#A8A29E">Bind a partner to share</text>
  </g>

  <text x="24" y="290" font-size="11" fill="#57534E" font-weight="600">TODAY'S CHECK-IN</text>

  <!-- Empty state -->
  <g transform="translate(24, 312)">
    <rect width="342" height="180" rx="12" fill="#F5F5F4" stroke="#E7E5E4" stroke-dasharray="4,4"/>
    <circle cx="171" cy="60" r="28" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="171" y="70" font-size="24" text-anchor="middle">🎯</text>
    <text x="171" y="118" font-size="16" fill="#1C1917" text-anchor="middle" font-weight="600">Today hasn't been logged yet</text>
    <text x="171" y="138" font-size="13" fill="#57534E" text-anchor="middle">Log your first one and we'll draw your curve.</text>
    <g transform="translate(115, 152)">
      <rect width="112" height="36" rx="8" fill="#FF6B6B"/>
      <text x="56" y="23" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">Log first →</text>
    </g>
  </g>

  <!-- Tab bar -->
  <rect x="0" y="780" width="390" height="64" fill="#FFFFFF" stroke="#E7E5E4"/>
  <rect x="20" y="788" width="58" height="44" rx="12" fill="#FFE4E6"/>
  <text x="49" y="810" font-size="14" text-anchor="middle">🏠</text>
  <text x="49" y="828" font-size="10" fill="#E11D48" text-anchor="middle" font-weight="500">Home</text>
</svg>