<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#FAFAF9"/>
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" fill-opacity="0.85" stroke="#E7E5E4"/>
  <text x="24" y="36" font-size="20" fill="#1C1917">←</text>
  <text x="195" y="36" font-size="16" fill="#1C1917" text-anchor="middle" font-weight="600">Workout</text>

  <text x="24" y="100" font-size="20" fill="#1C1917" font-weight="700">What did you do?</text>

  <!-- Voice button -->
  <g transform="translate(195, 220)">
    <circle cx="0" cy="0" r="64" fill="#FFE4E6" opacity="0.5"/>
    <circle cx="0" cy="0" r="48" fill="#FF6B6B"/>
    <text x="0" y="8" font-size="28" text-anchor="middle" fill="#FFFFFF">🎤</text>
  </g>
  <text x="195" y="320" font-size="14" fill="#1C1917" text-anchor="middle" font-weight="500">"ran 30 minutes"</text>

  <!-- Type chips -->
  <text x="24" y="368" font-size="11" fill="#57534E" font-weight="600">TYPE</text>
  <g transform="translate(24, 380)">
    <rect x="0" y="0" width="44" height="44" rx="22" fill="#FFE4E6" stroke="#FF6B6B" stroke-width="2"/>
    <text x="22" y="32" font-size="20" text-anchor="middle">🏃</text>
    <rect x="52" y="0" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="74" y="32" font-size="20" text-anchor="middle">🏊</text>
    <rect x="104" y="0" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="126" y="32" font-size="20" text-anchor="middle">🚴</text>
    <rect x="156" y="0" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="178" y="32" font-size="20" text-anchor="middle">💪</text>
    <rect x="208" y="0" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="230" y="32" font-size="20" text-anchor="middle">🧘</text>
    <rect x="260" y="0" width="44" height="44" rx="22" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="282" y="32" font-size="20" text-anchor="middle">🚶</text>
  </g>
  <text x="24" y="448" font-size="14" fill="#1C1917" font-weight="600">Running</text>

  <!-- Duration -->
  <text x="24" y="488" font-size="11" fill="#57534E" font-weight="600">DURATION</text>
  <text x="24" y="524" font-size="32" fill="#1C1917" font-weight="700">30 min</text>
  <g transform="translate(24, 540)">
    <rect width="342" height="6" rx="3" fill="#F5F5F4"/>
    <rect width="142" height="6" rx="3" fill="#FF6B6B"/>
    <circle cx="142" cy="3" r="10" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="2"/>
  </g>
  <text x="24" y="568" font-size="11" fill="#A8A29E">0</text>
  <text x="366" y="568" font-size="11" fill="#A8A29E" text-anchor="end">60 min</text>

  <!-- Intensity -->
  <text x="24" y="600" font-size="11" fill="#57534E" font-weight="600">INTENSITY</text>
  <g transform="translate(24, 612)">
    <rect width="342" height="40" rx="8" fill="#F5F5F4"/>
    <rect x="120" y="4" width="106" height="32" rx="6" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="59" y="28" font-size="13" fill="#57534E" text-anchor="middle">Low</text>
    <text x="173" y="28" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">Med</text>
    <text x="287" y="28" font-size="13" fill="#57534E" text-anchor="middle">High</text>
  </g>

  <!-- Estimate -->
  <g transform="translate(24, 676)">
    <rect width="342" height="60" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="20" y="26" font-size="11" fill="#57534E" font-weight="600">ESTIMATED BURN</text>
    <text x="20" y="48" font-size="20" fill="#EF4444" font-weight="700">− 300 kcal</text>
    <text x="322" y="48" font-size="11" fill="#57534E" text-anchor="end">running · 30m · medium</text>
  </g>

  <g transform="translate(24, 760)">
    <rect width="342" height="48" rx="8" fill="#FF6B6B"/>
    <text x="171" y="30" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Save · 300 kcal</text>
  </g>
</svg>