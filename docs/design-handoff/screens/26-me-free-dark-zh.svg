    <text x="20" y="26" font-size="11" fill="#D6D3D1" font-weight="600">主题</text>
    <g transform="translate(20, 36)">
      <rect width="302" height="32" rx="8" fill="#181615"/>
      <rect x="206" y="2" width="92" height="28" rx="6" fill="#1C1917" stroke="#292524"/>
      <text x="63" y="20" font-size="13" fill="#A8A29E" text-anchor="middle">浅色</text>
      <text x="151" y="20" font-size="13" fill="#FAFAF9" text-anchor="middle" font-weight="600">深色</text>
      <text x="251" y="20" font-size="13" fill="#A8A29E" text-anchor="middle">跟随</text>
    </g>
  </g>

  <!-- Language -->
  <g transform="translate(24, 352)">
    <rect width="342" height="76" rx="12" fill="#1C1917" stroke="#292524"/>
    <text x="20" y="26" font-size="11" fill="#D6D3D1" font-weight="600">语言</text>
    <g transform="translate(20, 36)">
      <rect width="302" height="32" rx="8" fill="#181615"/>
      <rect x="2" y="2" width="148" height="28" rx="6" fill="#1C1917" stroke="#292524"/>
