      <text x="20" y="14" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="600">Pro</text>
      <defs><linearGradient id="proBadge26" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient></defs>
