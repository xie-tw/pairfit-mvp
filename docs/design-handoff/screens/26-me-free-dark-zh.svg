        <stop offset="0%" stop-color="#FB7185"/>
        <stop offset="100%" stop-color="#2DD4BF"/>
      </linearGradient>
    </defs>
    <circle cx="40" cy="40" r="24" fill="url(#av26)"/>
    <text x="40" y="48" font-size="22" text-anchor="middle">🦊</text>
    <text x="76" y="36" font-size="14" fill="#FAFAF9" font-weight="600">Mei</text>
    <text x="76" y="56" font-size="12" fill="#A8A29E">mei@example.com</text>
    <g transform="translate(264, 28)">
      <rect width="48" height="22" rx="11" fill="#292524"/>
      <text x="24" y="15" font-size="11" fill="#D6D3D1" text-anchor="middle">免费版</text>
    </g>
    <text x="322" y="48" font-size="14" fill="#A8A29E" text-anchor="end">›</text>
  </g>

  <!-- Theme -->
  <g transform="translate(24, 256)">
