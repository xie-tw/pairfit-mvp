    <text x="20" y="98" font-size="20" fill="#D6D3D1">⚙️</text>
    <text x="52" y="98" font-size="14" fill="#FAFAF9" font-weight="500">设置</text>
    <text x="322" y="98" font-size="14" fill="#A8A29E" text-anchor="end">›</text>

    <text x="20" y="158" font-size="20" fill="#D6D3D1">✨</text>
    <text x="52" y="158" font-size="14" fill="#FAFAF9" font-weight="500">更新内容</text>
    <text x="322" y="158" font-size="14" fill="#A8A29E" text-anchor="end">›</text>

    <text x="20" y="218" font-size="20" fill="#D6D3D1">🌍</text>
    <text x="52" y="218" font-size="14" fill="#FAFAF9" font-weight="500">帮助与反馈</text>
    <text x="322" y="218" font-size="14" fill="#A8A29E" text-anchor="end">›</text>
