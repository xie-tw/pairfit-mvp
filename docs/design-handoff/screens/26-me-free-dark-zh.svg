    <line x1="0" y1="60" x2="342" y2="60" stroke="#292524"/>
    <line x1="0" y1="120" x2="342" y2="120" stroke="#292524"/>
    <line x1="0" y1="180" x2="342" y2="180" stroke="#292524"/>

    <text x="20" y="38" font-size="20" fill="#FB7185">👑</text>
    <text x="52" y="38" font-size="14" fill="#FAFAF9" font-weight="500">订阅</text>
    <g transform="translate(282, 22)">
