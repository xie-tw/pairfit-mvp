<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#0C0A09"/>
  <rect x="0" y="0" width="390" height="56" fill="#1C1917" fill-opacity="0.85" stroke="#292524"/>
  <text x="195" y="36" font-size="16" fill="#FAFAF9" text-anchor="middle" font-weight="600">我的</text>

  <text x="24" y="100" font-size="24" fill="#FAFAF9" font-weight="700">我的</text>
  <text x="24" y="124" font-size="14" fill="#D6D3D1">资料、设置与订阅。</text>

  <!-- Account card -->
  <g transform="translate(24, 156)">
    <rect width="342" height="80" rx="12" fill="#1C1917" stroke="#292524"/>
    <defs>
