<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#FAFAF9"/>
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" fill-opacity="0.85" stroke="#E7E5E4"/>
  <text x="24" y="36" font-size="20" fill="#1C1917">←</text>
  <text x="195" y="36" font-size="16" fill="#1C1917" text-anchor="middle" font-weight="600">Profile</text>

  <text x="24" y="100" font-size="20" fill="#1C1917" font-weight="700">Profile</text>
  <text x="24" y="124" font-size="13" fill="#57534E">Avatar, units, language, sign out.</text>

  <!-- Identity card -->
  <g transform="translate(24, 156)">
    <rect width="342" height="80" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <defs>
      <linearGradient id="av28" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FF6B6B"/>
        <stop offset="100%" stop-color="#14B8A6"/>
      </linearGradient>
    </defs>
    <circle cx="44" cy="40" r="24" fill="url(#av28)"/>
    <text x="44" y="48" font-size="22" text-anchor="middle">🦊</text>
    <text x="80" y="36" font-size="14" fill="#1C1917" font-weight="600">Mei</text>
    <text x="80" y="56" font-size="12" fill="#57534E">mei@example.com</text>
    <g transform="translate(264, 28)">
      <rect width="60" height="22" rx="11" fill="#F5F5F4" stroke="#E7E5E4"/>
      <text x="30" y="15" font-size="11" fill="#57534E" text-anchor="middle">Free tier</text>
    </g>
  </g>

  <!-- Avatar picker -->
  <g transform="translate(24, 252)">
    <rect width="342" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="20" y="26" font-size="11" fill="#57534E" font-weight="600">AVATAR</text>
    <g transform="translate(20, 36)">
      <circle cx="16" cy="20" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="16" y="26" font-size="14" fill="#1C1917" text-anchor="middle" font-weight="600">M</text>
      <circle cx="64" cy="20" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="64" y="26" font-size="22" text-anchor="middle">🦊</text>
      <circle cx="112" cy="20" r="20" fill="#FFE4E6" stroke="#FF6B6B" stroke-width="2"/>
      <text x="112" y="28" font-size="22" text-anchor="middle">🐶</text>
      <circle cx="160" cy="20" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="160" y="26" font-size="22" text-anchor="middle">🐱</text>
      <circle cx="208" cy="20" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="208" y="26" font-size="22" text-anchor="middle">🐼</text>
      <circle cx="256" cy="20" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="256" y="26" font-size="22" text-anchor="middle">🦁</text>
      <circle cx="304" cy="20" r="20" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="304" y="26" font-size="22" text-anchor="middle">🐸</text>
    </g>
  </g>

  <!-- Nickname -->
  <g transform="translate(24, 372)">
    <rect width="342" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <g transform="translate(20, 16)">
      <text x="0" y="14" font-size="11" fill="#57534E" font-weight="600">NICKNAME</text>
      <g transform="translate(220, 0)">
        <rect width="100" height="20" rx="10" fill="#CCFBF1"/>
        <text x="50" y="14" font-size="11" fill="#0F766E" text-anchor="middle" font-weight="600">✓ Saved</text>
      </g>
    </g>
    <rect x="20" y="40" width="302" height="40" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="34" y="64" font-size="14" fill="#1C1917">Mei</text>
  </g>

  <!-- Unit toggle -->
  <g transform="translate(24, 492)">
    <rect width="342" height="84" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="20" y="26" font-size="11" fill="#57534E" font-weight="600">WEIGHT UNIT</text>
    <g transform="translate(20, 36)">
      <rect width="302" height="36" rx="8" fill="#F5F5F4"/>
      <rect x="2" y="2" width="148" height="32" rx="6" fill="#FFFFFF" stroke="#E7E5E4"/>
      <text x="76" y="22" font-size="13" fill="#1C1917" text-anchor="middle" font-weight="600">Kilograms (kg)</text>
      <text x="227" y="22" font-size="13" fill="#57534E" text-anchor="middle">Pounds (lb)</text>
    </g>
  </g>

  <!-- Sign out -->
  <g transform="translate(24, 700)">
    <rect width="342" height="48" rx="8" fill="#EF4444"/>
    <text x="171" y="30" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Sign out</text>
  </g>
  <text x="195" y="772" font-size="11" fill="#A8A29E" text-anchor="middle">Sign out clears your session on this device.</text>
</svg>