<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#FAFAF9"/>
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" fill-opacity="0.85" stroke="#E7E5E4"/>
  <text x="195" y="36" font-size="16" fill="#1C1917" text-anchor="middle" font-weight="600">Trends</text>

  <text x="24" y="100" font-size="24" fill="#1C1917" font-weight="700">Trends</text>

  <!-- AI weekly report hero -->
  <g transform="translate(24, 132)">
    <defs>
      <linearGradient id="aiGrad25" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFE4E6"/>
        <stop offset="100%" stop-color="#CCFBF1"/>
      </linearGradient>
    </defs>
    <rect width="342" height="240" rx="16" fill="url(#aiGrad25)" stroke="#E7E5E4"/>
    <g transform="translate(140, 24)">
      <rect width="62" height="62" rx="20" fill="#FFFFFF" stroke="#FF6B6B"/>
      <text x="31" y="40" font-size="32" text-anchor="middle">✨</text>
    </g>
    <text x="171" y="120" font-size="18" fill="#1C1917" text-anchor="middle" font-weight="700">Your weekly summary</text>
    <text x="171" y="148" font-size="13" fill="#57534E" text-anchor="middle">Week 38 · Sept 9 – Sept 15</text>

    <line x1="40" y1="170" x2="302" y2="170" stroke="#FFFFFF" stroke-opacity="0.6"/>

    <text x="40" y="194" font-size="13" fill="#1C1917" font-weight="600">Highlights</text>
    <text x="40" y="214" font-size="12" fill="#57534E">• You ate 12% more protein than last week</text>
    <text x="40" y="232" font-size="12" fill="#57534E">• Your weight is on track to hit goal by Nov 14</text>
  </g>

  <!-- 3 quick stats -->
  <g transform="translate(24, 396)">
    <rect width="106" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="14" y="28" font-size="11" fill="#57534E" font-weight="600">CALORIES</text>
    <text x="14" y="56" font-size="20" fill="#1C1917" font-weight="700">12.6k</text>
    <text x="14" y="78" font-size="11" fill="#10B981" font-weight="500">+12% ↗</text>
  </g>
  <g transform="translate(140, 396)">
    <rect width="106" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="14" y="28" font-size="11" fill="#57534E" font-weight="600">WORKOUTS</text>
    <text x="14" y="56" font-size="20" fill="#1C1917" font-weight="700">5h 15m</text>
    <text x="14" y="78" font-size="11" fill="#10B981" font-weight="500">+23% ↗</text>
  </g>
  <g transform="translate(256, 396)">
    <rect width="110" height="100" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="14" y="28" font-size="11" fill="#57534E" font-weight="600">WEIGHT</text>
    <text x="14" y="56" font-size="20" fill="#1C1917" font-weight="700">− 0.5 kg</text>
    <text x="14" y="78" font-size="11" fill="#10B981" font-weight="500">on track</text>
  </g>

  <!-- CTA -->
  <g transform="translate(24, 524)">
    <rect width="342" height="48" rx="8" fill="#FF6B6B"/>
    <text x="171" y="30" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Share with partner</text>
  </g>
</svg>