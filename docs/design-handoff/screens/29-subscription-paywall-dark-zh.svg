<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#0C0A09"/>
  <rect x="0" y="0" width="390" height="56" fill="#1C1917" fill-opacity="0.85" stroke="#292524"/>
  <text x="24" y="36" font-size="20" fill="#FAFAF9">←</text>
  <text x="195" y="36" font-size="16" fill="#FAFAF9" text-anchor="middle" font-weight="600">订阅</text>

  <text x="24" y="100" font-size="20" fill="#FAFAF9" font-weight="700">解锁 Pro</text>
  <text x="24" y="124" font-size="13" fill="#D6D3D1">解锁后你和 ta 都用得上。</text>

  <!-- Hero card -->
  <g transform="translate(24, 156)">
    <defs>
      <linearGradient id="proHero29" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FB7185"/>
        <stop offset="100%" stop-color="#2DD4BF"/>
      </linearGradient>
    </defs>
    <rect width="342" height="160" rx="16" fill="url(#proHero29)"/>
    <text x="20" y="44" font-size="32" fill="#FFFFFF">👑</text>
    <text x="20" y="84" font-size="22" fill="#FFFFFF" font-weight="700">Pro</text>
    <text x="20" y="110" font-size="13" fill="#FFFFFF" fill-opacity="0.9">Move together. Win together.</text>
    <text x="20" y="138" font-size="11" fill="#FFFFFF" fill-opacity="0.7">¥ 24.99 / 月 · 1 人付费 = 2 人解锁</text>
  </g>

  <!-- Features -->
  <g transform="translate(24, 336)">
    <rect width="342" height="200" rx="12" fill="#1C1917" stroke="#292524"/>
    <text x="20" y="26" font-size="13" fill="#FAFAF9" font-weight="700">包含什么</text>
    <g transform="translate(20, 36)">
      <text x="0" y="20" font-size="14" fill="#10B981">✓</text>
      <text x="20" y="20" font-size="13" fill="#D6D3D1">无广告</text>
      <text x="0" y="48" font-size="14" fill="#10B981">✓</text>
      <text x="20" y="48" font-size="13" fill="#D6D3D1">AI 周报</text>
      <text x="0" y="76" font-size="14" fill="#10B981">✓</text>
      <text x="20" y="76" font-size="13" fill="#D6D3D1">自定义主题</text>
      <text x="0" y="104" font-size="14" fill="#10B981">✓</text>
      <text x="20" y="104" font-size="13" fill="#D6D3D1">高级曲线(对比 ta)</text>
      <text x="0" y="132" font-size="14" fill="#A8A29E">○</text>
      <text x="20" y="132" font-size="13" fill="#A8A29E">云同步(V1.1)</text>
    </g>
  </g>

  <!-- Pricing -->
  <g transform="translate(24, 556)">
    <rect width="167" height="80" rx="12" fill="#1C1917" stroke="#292524"/>
    <text x="14" y="26" font-size="14" fill="#FAFAF9" font-weight="600">月付</text>
    <text x="14" y="58" font-size="22" fill="#FAFAF9" font-weight="700">¥ 24.99<tspan font-size="12" fill="#A8A29E"> / 月</tspan></text>
  </g>
  <g transform="translate(199, 556)">
    <rect width="167" height="80" rx="12" fill="#2DD4BF" fill-opacity="0.15" stroke="#2DD4BF" stroke-width="2"/>
    <text x="14" y="26" font-size="14" fill="#FAFAF9" font-weight="600">年付 · 省 50%</text>
    <text x="14" y="58" font-size="22" fill="#2DD4BF" font-weight="700">¥ 149<tspan font-size="12" fill="#A8A29E"> / 年</tspan></text>
  </g>

  <!-- CTA -->
  <g transform="translate(24, 660)">
    <rect width="342" height="48" rx="8" fill="#2DD4BF"/>
    <text x="171" y="30" font-size="16" fill="#0C0A09" text-anchor="middle" font-weight="600">模拟订阅(双方解锁)</text>
  </g>
  <text x="195" y="730" font-size="11" fill="#A8A29E" text-anchor="middle">V1.1:接 Stripe / Apple Pay</text>
