<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <rect width="390" height="844" fill="#0C0A09"/>
  <rect x="0" y="0" width="390" height="56" fill="#1C1917" fill-opacity="0.85" stroke="#292524"/>
  <text x="195" y="36" font-size="16" fill="#FAFAF9" text-anchor="middle" font-weight="600">趋势</text>

  <text x="24" y="100" font-size="24" fill="#FAFAF9" font-weight="700">趋势</text>
  <text x="24" y="124" font-size="14" fill="#D6D3D1">看看你这季度的轨迹。</text>

  <!-- Workouts area chart card -->
  <g transform="translate(24, 156)">
    <rect width="342" height="220" rx="12" fill="#1C1917" stroke="#292524"/>
    <text x="20" y="28" font-size="14" fill="#FAFAF9" font-weight="600">运动</text>
    <text x="20" y="46" font-size="11" fill="#A8A29E">时长 / 周 · 最近 90 天</text>

    <!-- Window toggle -->
    <g transform="translate(220, 16)">
      <rect width="106" height="24" rx="6" fill="#181615"/>
      <rect x="2" y="2" width="34" height="20" rx="4" fill="#1C1917" stroke="#292524"/>
      <text x="19" y="16" font-size="11" fill="#A8A29E" text-anchor="middle">7D</text>
      <text x="53" y="16" font-size="11" fill="#A8A29E" text-anchor="middle">30D</text>
      <rect x="68" y="2" width="34" height="20" rx="4" fill="#2DD4BF" fill-opacity="0.15"/>
      <text x="85" y="16" font-size="11" fill="#2DD4BF" text-anchor="middle" font-weight="600">90D</text>
    </g>

    <!-- Area chart -->
    <path d="M 20 180 L 70 170 L 120 160 L 170 150 L 220 140 L 270 130 L 320 128 L 320 200 L 20 200 Z" fill="#2DD4BF" fill-opacity="0.15"/>
    <polyline points="20,180 70,170 120,160 170,150 220,140 270,130 320,128" stroke="#2DD4BF" stroke-width="2.5" fill="none"/>
    <circle cx="20" cy="180" r="3" fill="#2DD4BF"/>
    <circle cx="170" cy="150" r="3" fill="#2DD4BF"/>
    <circle cx="320" cy="128" r="3" fill="#2DD4BF"/>
  </g>

  <!-- AI report card -->
  <g transform="translate(24, 396)">
    <rect width="342" height="100" rx="12" fill="#1C1917" stroke="#292524"/>
    <text x="20" y="32" font-size="13" fill="#2DD4BF">✨</text>
    <text x="36" y="32" font-size="11" fill="#D6D3D1" font-weight="600">AI 周报 · 第 38 周</text>
    <text x="20" y="60" font-size="14" fill="#FAFAF9" font-weight="500">本周你累计运动 4 小时 15 分钟,</text>
    <text x="20" y="80" font-size="14" fill="#FAFAF9" font-weight="500">比上周多 23%。继续保持!</text>
  </g>

  <!-- Stat tile -->
  <g transform="translate(24, 516)">
    <rect width="342" height="80" rx="12" fill="#1C1917" stroke="#292524"/>
    <circle cx="32" cy="40" r="16" fill="#FB7185" fill-opacity="0.15"/>
    <text x="32" y="46" font-size="18" text-anchor="middle">🔥</text>
    <text x="58" y="36" font-size="11" fill="#A8A29E" font-weight="600">最长连续</text>
    <text x="58" y="60" font-size="20" fill="#FAFAF9" font-weight="700">12 天</text>
    <text x="322" y="60" font-size="13" fill="#10B981" text-anchor="end" font-weight="500">+ 2 天 ↗</text>
  </g>
</svg>