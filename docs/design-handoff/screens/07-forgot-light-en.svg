  </g>
  <text x="195" y="558" font-size="14" fill="#57534E" text-anchor="middle"><tspan fill="#E11D48" font-weight="500">Back to sign in</tspan></text>
  <text x="195" y="824" font-size="10" fill="#A8A29E" text-anchor="middle">07-forgot-light-en</text>
