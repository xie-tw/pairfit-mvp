  <g transform="translate(167, 120)">
    <rect width="56" height="56" rx="16" fill="url(#brandGrad7)"/>
    <text x="28" y="36" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">PF</text>
    <defs><linearGradient id="brandGrad7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient></defs>
  </g>
  <text x="195" y="208" font-size="24" fill="#1C1917" text-anchor="middle" font-weight="700">Reset your password</text>
  <text x="195" y="234" font-size="14" fill="#57534E" text-anchor="middle">We'll email you a reset link.</text>
  <g transform="translate(24, 290)">
