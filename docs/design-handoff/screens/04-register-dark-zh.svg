<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, system-ui, sans-serif">
  <!-- PairFit · Register · Dark · 中文 -->
  <rect width="390" height="844" fill="#0C0A09"/>

  <!-- Brand mark -->
  <g transform="translate(167, 80)">
    <rect width="56" height="56" rx="16" fill="url(#brandGrad4)"/>
    <text x="28" y="36" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">PF</text>
    <defs>
      <linearGradient id="brandGrad4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FB7185"/>
        <stop offset="100%" stop-color="#2DD4BF"/>
      </linearGradient>
    </defs>
  </g>

  <!-- Title -->
  <text x="195" y="172" font-size="24" fill="#FAFAF9" text-anchor="middle" font-weight="700">创建你的账号</text>
  <text x="195" y="198" font-size="14" fill="#D6D3D1" text-anchor="middle">三步搞定,即可开始。</text>

  <!-- Card -->
  <g transform="translate(24, 230)">
    <rect width="342" height="320" rx="16" fill="#1C1917" stroke="#292524"/>
    <text x="0" y="20" font-size="14" fill="#FAFAF9" font-weight="500">昵称 <tspan fill="#FB7185">*</tspan></text>
    <rect x="0" y="28" width="342" height="40" rx="8" fill="#1C1917" stroke="#292524"/>
    <text x="44" y="52" font-size="14" fill="#A8A29E">想让我们怎么称呼你?</text>

    <text x="0" y="92" font-size="14" fill="#FAFAF9" font-weight="500">邮箱 <tspan fill="#FB7185">*</tspan></text>
    <rect x="0" y="100" width="342" height="40" rx="8" fill="#1C1917" stroke="#292524"/>
    <text x="44" y="124" font-size="14" fill="#A8A29E">you@example.com</text>

    <text x="0" y="164" font-size="14" fill="#FAFAF9" font-weight="500">密码 <tspan fill="#FB7185">*</tspan></text>
    <rect x="0" y="172" width="342" height="40" rx="8" fill="#1C1917" stroke="#292524"/>
    <text x="44" y="196" font-size="14" fill="#A8A29E">8 位以上</text>
    <text x="0" y="232" font-size="12" fill="#A8A29E">至少 8 位,包含字母和数字。</text>

    <text x="0" y="260" font-size="14" fill="#FAFAF9" font-weight="500">确认密码 <tspan fill="#FB7185">*</tspan></text>
    <rect x="0" y="268" width="342" height="40" rx="8" fill="#1C1917" stroke="#292524"/>
  </g>

  <!-- Avatar picker -->
  <text x="24" y="588" font-size="14" fill="#FAFAF9" font-weight="500">选个头像(可选)</text>
  <g transform="translate(24, 600)">
    <circle cx="114" cy="14" r="20" fill="#1C1917" stroke="#FB7185" stroke-width="2"/>
    <text x="114" y="22" font-size="20" text-anchor="middle">🐶</text>
  </g>

  <!-- CTA -->
  <g transform="translate(24, 670)">
    <rect width="342" height="48" rx="8" fill="#FB7185"/>
    <text x="171" y="30" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">创建账号</text>
  </g>

  <text x="195" y="752" font-size="14" fill="#D6D3D1" text-anchor="middle">已经有账号? <tspan fill="#FB7185" font-weight="500">去登录</tspan></text>

  <text x="195" y="824" font-size="10" fill="#A8A29E" text-anchor="middle">04-register-dark-zh</text>
</svg>